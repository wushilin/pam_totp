name: release

# Pushing a tag such as v0.1.0 builds the module and attaches it to a GitHub
# Release. The .so is a release asset; it is never committed to the repository.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Install PAM headers
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          mkdir dist
          cp target/release/libpam_totp.so "dist/pam_totp-${{ matrix.arch }}-linux-gnu.so"
          cp target/release/otputil "dist/otputil-${{ matrix.arch }}-linux-gnu"
          cd dist && sha256sum * > "SHA256SUMS-${{ matrix.arch }}.txt"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/pam_totp-${{ matrix.arch }}-linux-gnu.so
            dist/otputil-${{ matrix.arch }}-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
